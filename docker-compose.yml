services:
  game:
    build: .
    container_name: drop-words
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # 컨테이너 안에서는 호스트의 LAN IP를 알 수 없으므로 직접 지정한다.
      # 예) HOST_URL=http://192.168.0.10:3000
      - PUBLIC_URL=${PUBLIC_URL:-}
      - PORT=3000

  # 외부망 공개가 필요할 때만 사용한다:  docker compose --profile tunnel up
  # 1) Cloudflare Zero Trust에서 터널을 만들고 토큰을 발급받아
  # 2) .env 파일에 TUNNEL_TOKEN=... 을 넣은 뒤 실행한다.
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: drop-words-tunnel
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    depends_on:
      - game
